lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.0.0
        version: 5.0.4

  packages/app:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.2.0
      shared:
        specifier: workspace:*
        version: link:../shared

  packages/shared:
    dependencies:
      lodash:
        specifier: ^4.17.21
        version: 4.17.21

packages:

  react@18.2.0:
    resolution: {integrity: sha512-fake1==}
    engines: {node: '>=0.10.0'}

  lodash@4.17.21:
    resolution: {integrity: sha512-fake3==}

  typescript@5.0.4:
    resolution: {integrity: sha512-fake4==}
    engines: {node: '>=12.20'}
    hasBin: true

snapshots:

  react@18.2.0: {}

  lodash@4.17.21: {}

  typescript@5.0.4: {}
